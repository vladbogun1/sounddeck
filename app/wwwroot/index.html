<!DOCTYPE html>
<html lang="ru" data-theme="neu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoundDeck</title>
  <link rel="stylesheet" href="fa/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge"><i class="fa-solid fa-volume-high"></i></div>
        <div>
          <div class="brand-title">SoundDeck</div>
          <div class="brand-sub" id="healthLine">управление источниками звука</div>
        </div>
      </div>
      <div class="topactions">
        <button class="pill update-pill" id="updateBtn" hidden></button>
        <button class="pill" id="profilesBtn" title="Профили">
          <i class="fa-solid fa-layer-group"></i>
          <span id="activeProfileName">Профили</span>
          <i class="fa-solid fa-chevron-down chev"></i>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Настройки" aria-label="Настройки"><i class="fa-solid fa-gear"></i></button>
        <button class="icon-btn" id="closeBtn" title="Свернуть в трей" aria-label="Свернуть"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="settings-pop profiles-pop" id="profilesPop" hidden>
        <div class="pop-list" id="profilesList"></div>
        <button class="ghost accent full" id="saveProfileBtn"><i class="fa-solid fa-plus"></i> <span id="saveProfileLbl"></span></button>
      </div>

    </header>

    <div class="body">
      <main class="board" id="board"></main>
      <div class="dock" id="dock"></div>

      <section class="settings-view" id="settingsView" aria-hidden="true">
        <div class="settings-scroll">
          <h2 class="settings-h" id="settingsTitle">Settings</h2>

          <div class="set-card">
            <div class="set-row">
              <div>
                <div class="set-title" id="t_autoheal"></div>
                <div class="set-desc" id="d_autoheal"></div>
              </div>
              <button class="switch" id="autohealSwitch" role="switch"><span></span></button>
            </div>
            <div class="set-row">
              <div>
                <div class="set-title" id="t_autostart"></div>
                <div class="set-desc" id="d_autostart"></div>
              </div>
              <button class="switch" id="autostartSwitch" role="switch"><span></span></button>
            </div>
            <div class="set-row">
              <div>
                <div class="set-title" id="t_group"></div>
                <div class="set-desc" id="d_group"></div>
              </div>
              <button class="switch" id="groupSwitch" role="switch"><span></span></button>
            </div>
          </div>

          <div class="set-section-label" id="t_devices"></div>
          <div class="set-hint" id="d_devices"></div>
          <div class="set-card" id="devicesList"></div>

          <div class="set-section-label" id="t_updates"></div>
          <div class="set-card">
            <div class="set-row">
              <div>
                <div class="set-title" id="t_autoupdate"></div>
                <div class="set-desc" id="d_autoupdate"></div>
              </div>
              <button class="switch" id="autoupdateSwitch" role="switch"><span></span></button>
            </div>
            <div class="set-row upd-row">
              <div class="upd-info">
                <div class="set-title" id="updVersion"></div>
                <div class="set-desc" id="updStatus"></div>
                <div class="upd-progress" id="updProgress" hidden><div></div></div>
                <div class="upd-error" id="updError" hidden></div>
              </div>
              <div class="upd-actions" id="updActions"></div>
            </div>
          </div>

          <div class="set-section-label" id="t_theme"></div>
          <div class="theme-grid" id="themeGrid"></div>

          <div class="set-section-label" id="t_lang"></div>
          <div class="lang-grid" id="langGrid"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="panels.js"></script>
  <script src="layout.js"></script>
  <script src="drag.js"></script>
  <script>boot();</script>
</body>
</html>
